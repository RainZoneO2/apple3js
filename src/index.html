<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>apple3js</title>
        <link rel="icon" href="/alma.png" />
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <canvas class="webgl"></canvas>
        <button id="tour-toggle">Start tour</button>
        <div id="audio-controls">
            <button id="mute-toggle">Sound: On</button>
            <button id="next-track">Next track</button>
        </div>
        <div id="memory-modal" class="hidden">
            <div class="modal-backdrop"></div>
            <figure class="modal-card">
                <img id="modal-img" alt="Memory" />
                <figcaption>
                    <span id="modal-title"></span>
                    <span id="modal-date"></span>
                </figcaption>
                <button id="modal-close">Close</button>
            </figure>
        </div>
        <div id="start-screen">
            <p class="start-title">apple3js</p>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <button id="start-button" disabled>Loading…</button>
        </div>
        <script type="module" src="./script.js"></script>
    </body>
</html>
